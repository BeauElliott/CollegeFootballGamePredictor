# Docker Compose for development
version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: collegefootball-db-dev
    environment:
      POSTGRES_DB: collegefootball
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - collegefootball-network

volumes:
  postgres_data_dev:
    driver: local

networks:
  collegefootball-network:
    driver: bridge
